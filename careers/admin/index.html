<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuway Careers — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/careers.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="../assets/favicon.svg">
</head>
<body class="admin">

<div id="demo" class="demo-banner hidden">Demo mode — changes live only in this browser tab. Add your Supabase keys in <code>assets/config.js</code> to go live.</div>

<!-- ---------- sign in ---------- -->
<div id="login" class="login hidden">
  <div class="login-box">
    <img src="../assets/logo-teal.svg" alt="Nuway" class="login-logo">
    <h2>Careers admin</h2>
    <p class="muted small">Head office sign-in. Your email must be on the admin list.</p>
    <div id="login-alert"></div>
    <div class="field"><label>Email</label><input type="email" id="l-email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="l-pass" autocomplete="current-password"></div>
    <button class="btn" id="l-go" style="width:100%;justify-content:center">Sign in</button>
    <p class="small muted" style="margin:14px 0 0;text-align:center">Or <a href="#" id="l-magic">email me a sign-in link</a></p>
  </div>
</div>

<!-- ---------- app ---------- -->
<div id="shell" class="shell hidden">
  <aside class="side-nav">
    <img src="../assets/logo-white.svg" alt="Nuway" class="nav-logo">
    <div class="nav-title">Careers admin</div>
    <a href="#jobs" data-nav="jobs">Jobs <span class="pill" id="n-jobs"></span></a>
    <a href="#applicants" data-nav="applicants">Applicants <span class="pill hot" id="n-new"></span></a>
    <a href="#stores" data-nav="stores">Stores</a>
    <div class="nav-foot">
      <a href="../" target="_blank">View careers page ↗</a>
      <span id="who" class="small"></span>
      <a href="#" id="signout">Sign out</a>
    </div>
  </aside>
  <main class="content" id="content"><div class="spinner"></div></main>
</div>

<!-- ---------- modal ---------- -->
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

<script src="../assets/config.js"></script>
<script src="../assets/data.js"></script>
<script src="admin.js"></script>
</body>
</html>
